<!DOCTYPE html>
<html>
<head>
    <title>Word Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-box">
        <h1>Word Puzzle Game</h1>
        <p class="instructions">
    Instructions: Unscramble the letters and type the correct word.
    Click "Check Answer" to submit your answer.
</p>
        <p>Unscramble the letters and find the correct word!</p>

        <p class="question">Unscramble the word:</p>

        <h2 id="scrambled-word">TEACHER</h2>
        <p id="timer">Time: 30 seconds</p>

        <input type="text" id="answer" placeholder="Enter your answer">

        <button onclick="checkAnswer()">Check Answer</button>
        <button onclick="nextWord()">Next Word</button>
        <button onclick="restartGame()">Restart Game</button>

        <p id="result"></p>

        <p>Score: <span id="score">0</span></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
